<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Visa Sponsor Register</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #0a0a0a;
        }

        .top-bar {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .top-bar-search {
            display: flex;
            gap: 10px;
        }

        .top-bar-search button {
            padding: 8px 15px;
            background: #4a90e2;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-weight: 600;
        }

        .top-bar-search button:hover {
            background: #3a7bc8;
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            padding: 15px;
        }

        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 120px);
        }

        .filter-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            flex-shrink: 0;
        }

        .filter-card.industry-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .filter-card.industry-card .checkbox-group {
            flex: 1;
            max-height: none;
        }

        .filter-card h3 {
            color: #fff;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            margin: 10px 0;
        }

        .date-inputs {
            display: flex;
            gap: 8px;
        }

        .date-inputs input {
            flex: 1;
            padding: 6px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            font-size: 0.75rem;
            border-radius: 3px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
        }

        .checkbox-item input {
            width: 14px;
            height: 14px;
            accent-color: #fff;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            color: #ccc;
            font-size: 0.8rem;
        }

        .filter-input {
            width: 100%;
            padding: 6px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            font-size: 0.8rem;
            margin-bottom: 8px;
            border-radius: 3px;
        }

        .reset-btn {
            width: 100%;
            padding: 8px;
            background: #444;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .reset-btn:hover {
            background: #555;
        }

        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .chart-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .chart-container h2 {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 10px;
            min-height: 300px;
        }

        svg {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .clickable-bar:hover {
            opacity: 0.7;
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .region-box {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.7rem;
        }

        .region-box:hover {
            border-color: #4a90e2;
            background: rgba(74, 144, 226, 0.1);
        }

        .region-box.selected {
            border-color: #4a90e2;
            background: rgba(74, 144, 226, 0.2);
        }

        .region-name {
            color: #ccc;
            font-size: 0.7rem;
            margin-bottom: 4px;
        }

        .region-count {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .table-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            grid-column: 2;
            grid-row: 2;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .table-header h2 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .table-search {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 250px;
        }

        .table-search input {
            flex: 1;
            padding: 6px 10px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 3px;
            color: #000;
            font-size: 0.8rem;
        }

        .table-nav {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-btn {
            padding: 5px 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .nav-btn:hover:not(:disabled) {
            background: #444;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            color: #999;
            font-size: 0.75rem;
            padding: 0 5px;
            white-space: nowrap;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 3px;
            background: #0a0a0a;
            max-height: 550px;
            min-height: 450px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .data-table th {
            padding: 8px;
            text-align: left;
            color: #00d4ff;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        .data-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #333;
            color: #ccc;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-table tbody tr:hover {
            background: rgba(74, 144, 226, 0.05);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 15px 20px;
            text-align: center;
            color: #999;
            font-size: 0.8rem;
            margin-top: auto;
        }

        .footer a {
            color: #4a90e2;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .content {
                grid-template-columns: 1fr;
            }

            .table-container {
                grid-column: 1;
                grid-row: auto;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard() {
            const [sponsorData, setSponsorData] = useState([]);
            const [locationData, setLocationData] = useState({});
            const [loading, setLoading] = useState(true);
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 50;

            const [filters, setFilters] = useState({
                searchOrg: '',
                searchIndustry: '',
                searchRegion: '',
                regions: [],
                industries: [],
                years: [],
                startYear: 2013,
                endYear: 2026
            });

            useEffect(() => {
                async function loadData() {
                    try {
                        const sponsorResponse = await fetch('data/uk_sponsor_register.csv');
                        const sponsorText = await sponsorResponse.text();
                        
                        Papa.parse(sponsorText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setSponsorData(results.data);
                            }
                        });

                        const locationResponse = await fetch('data/IPN_GB_2022.csv');
                        const locationText = await locationResponse.text();
                        
                        Papa.parse(locationText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                const locMap = {};
                                results.data.forEach(row => {
                                    if (row.placesort) {
                                        locMap[row.placesort.toLowerCase()] = {
                                            ee21nm: row.eer21nm
                                        };
                                    }
                                });
                                setLocationData(locMap);
                                setLoading(false);
                            }
                        });
                    } catch (error) {
                        console.error('Error loading data:', error);
                        setLoading(false);
                    }
                }

                loadData();
            }, []);

            const processedData = useMemo(() => {
                if (!sponsorData.length) return [];

                return sponsorData.map(row => {
                    const dateAdded = new Date(row['Date Added']);
                    const year = dateAdded.getFullYear();
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};

                    return {
                        ...row,
                        year,
                        region: locInfo.ee21nm || 'Unknown',
                        town: row.Town || 'Unknown'
                    };
                }).filter(row => {
                    const matchesOrg = row['Organisation Name']?.toLowerCase().includes(filters.searchOrg.toLowerCase());
                    const matchesIndustry = row.Industry?.toLowerCase().includes(filters.searchIndustry.toLowerCase());
                    const matchesRegion = filters.regions.length === 0 || filters.regions.includes(row.region);
                    const matchesIndList = filters.industries.length === 0 || filters.industries.includes(row.Industry);
                    const matchesYear = filters.years.length === 0 || filters.years.includes(row.year);
                    const matchesDateRange = row.year >= filters.startYear && row.year <= filters.endYear;

                    return matchesOrg && matchesIndustry && matchesRegion && matchesIndList && matchesYear && matchesDateRange;
                });
            }, [sponsorData, locationData, filters]);

            useEffect(() => {
                setCurrentPage(1);
            }, [processedData]);

            const totalPages = Math.ceil(processedData.length / itemsPerPage);
            const startIdx = (currentPage - 1) * itemsPerPage;
            const tableData = processedData.slice(startIdx, startIdx + itemsPerPage);

            const uniqueRegions = useMemo(() => {
                const regions = new Set(sponsorData.map(row => {
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};
                    return locInfo.ee21nm || 'Unknown';
                }));
                return Array.from(regions).filter(r => r !== 'Unknown').sort();
            }, [sponsorData, locationData]);

            const uniqueIndustries = useMemo(() => {
                return Array.from(new Set(sponsorData.map(row => row.Industry))).filter(Boolean).sort();
            }, [sponsorData]);

            const yearData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    grouped[row.year] = (grouped[row.year] || 0) + 1;
                });
                return Object.entries(grouped).sort().map(([year, count]) => ({
                    year: parseInt(year),
                    count
                }));
            }, [processedData]);

            const regionData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    if (!grouped[row.region]) {
                        grouped[row.region] = { region: row.region, count: 0 };
                    }
                    grouped[row.region].count += 1;
                });
                return Object.values(grouped).sort((a, b) => b.count - a.count);
            }, [processedData]);

            const resetFilters = () => {
                setFilters({
                    searchOrg: '',
                    searchIndustry: '',
                    searchRegion: '',
                    regions: [],
                    industries: [],
                    years: [],
                    startYear: 2013,
                    endYear: 2026
                });
                setCurrentPage(1);
            };

            if (loading) {
                return <div className="loading"><div className="spinner"></div></div>;
            }

            return (
                <div className="dashboard">
                    <div className="top-bar">
                        <h1>UK Visa Sponsor Register</h1>
                        <div className="top-bar-search">
                            <button onClick={resetFilters}>Reset Filters</button>
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="sidebar">
                            <div className="filter-card">
                                <h3>Total Organisations Found</h3>
                                <div className="kpi-value">{processedData.length.toLocaleString()}</div>
                            </div>

                            <div className="filter-card">
                                <h3>Registration Date</h3>
                                <div className="date-inputs">
                                    <input type="number" min="2013" max="2026" value={filters.startYear} onChange={(e) => setFilters({...filters, startYear: parseInt(e.target.value)})} />
                                    <input type="number" min="2013" max="2026" value={filters.endYear} onChange={(e) => setFilters({...filters, endYear: parseInt(e.target.value)})} />
                                </div>
                            </div>

                            <div className="filter-card">
                                <h3>Region</h3>
                                <input type="text" className="filter-input" placeholder="Search region..." value={filters.searchRegion} onChange={(e) => setFilters({...filters, searchRegion: e.target.value})} />
                                <div className="checkbox-group">
                                    {uniqueRegions.filter(reg => reg.toLowerCase().includes(filters.searchRegion.toLowerCase())).map(region => (
                                        <div key={region} className="checkbox-item">
                                            <input type="checkbox" checked={filters.regions.includes(region)} onChange={(e) => {
                                                if (e.target.checked) {
                                                    setFilters({...filters, regions: [...filters.regions, region]});
                                                } else {
                                                    setFilters({...filters, regions: filters.regions.filter(r => r !== region)});
                                                }
                                            }} />
                                            <label>{region}</label>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="filter-card industry-card">
                                <h3>Industry</h3>
                                <input type="text" className="filter-input" placeholder="Search industry..." value={filters.searchIndustry} onChange={(e) => setFilters({...filters, searchIndustry: e.target.value})} />
                                <div className="checkbox-group">
                                    {uniqueIndustries.filter(ind => ind.toLowerCase().includes(filters.searchIndustry.toLowerCase())).map(industry => (
                                        <div key={industry} className="checkbox-item">
                                            <input type="checkbox" checked={filters.industries.includes(industry)} onChange={(e) => {
                                                if (e.target.checked) {
                                                    setFilters({...filters, industries: [...filters.industries, industry]});
                                                } else {
                                                    setFilters({...filters, industries: filters.industries.filter(i => i !== industry)});
                                                }
                                            }} />
                                            <label>{industry}</label>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="content">
                            <div className="chart-container">
                                <h2>Industries by Year of Registration</h2>
                                <div className="chart-wrapper">
                                    <svg viewBox="0 0 500 300">
                                        {yearData.map((d, i) => {
                                            const maxCount = Math.max(...yearData.map(x => x.count), 1);
                                            const barHeight = (d.count / maxCount) * 220;
                                            const x = (i * (460 / yearData.length)) + 20;
                                            const y = 260 - barHeight;
                                            return (
                                                <g key={i} className="clickable-bar" onClick={() => {
                                                    if (filters.years.includes(d.year)) {
                                                        setFilters({...filters, years: filters.years.filter(yr => yr !== d.year)});
                                                    } else {
                                                        setFilters({...filters, years: [...filters.years, d.year]});
                                                    }
                                                }}>
                                                    <rect x={x} y={y} width={Math.max(1, (460 / yearData.length) - 2)} height={barHeight} fill="#4a90e2" />
                                                    <text x={x + (460 / yearData.length) / 2} y={280} textAnchor="middle" fill="#666" fontSize="10">{d.year}</text>
                                                    <text x={x + (460 / yearData.length) / 2} y={y - 3} textAnchor="middle" fill="#fff" fontSize="8" fontWeight="bold">{d.count}</text>
                                                </g>
                                            );
                                        })}
                                    </svg>
                                </div>
                            </div>

                            <div className="chart-container">
                                <h2>Industries by Region</h2>
                                <div className="regions-grid">
                                    {regionData.map(region => {
                                        const isSelected = filters.regions.includes(region.region);
                                        return (
                                            <div
                                                key={region.region}
                                                className={`region-box ${isSelected ? 'selected' : ''}`}
                                                onClick={() => {
                                                    if (filters.regions.includes(region.region)) {
                                                        setFilters({...filters, regions: filters.regions.filter(r => r !== region.region)});
                                                    } else {
                                                        setFilters({...filters, regions: [...filters.regions, region.region]});
                                                    }
                                                }}
                                            >
                                                <div className="region-name">{region.region}</div>
                                                <div className="region-count">{region.count}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="table-container full-width">
                                <div className="table-header">
                                    <h2>Organisation Name (Showing {startIdx + 1}-{Math.min(startIdx + itemsPerPage, processedData.length)} of {processedData.length.toLocaleString()})</h2>
                                    <div className="table-search">
                                        <input
                                            type="text"
                                            placeholder="Search organisation name..."
                                            value={filters.searchOrg}
                                            onChange={(e) => setFilters({...filters, searchOrg: e.target.value})}
                                        />
                                    </div>
                                    <div className="table-nav">
                                        <button className="nav-btn" onClick={() => setCurrentPage(1)} disabled={currentPage === 1}>⏮ First</button>
                                        <button className="nav-btn" onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1}>◀ Prev</button>
                                        <span className="page-info">Page {currentPage} / {totalPages}</span>
                                        <button className="nav-btn" onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages}>Next ▶</button>
                                        <button className="nav-btn" onClick={() => setCurrentPage(totalPages)} disabled={currentPage === totalPages}>Last ⏭</button>
                                    </div>
                                </div>
                                <div className="table-wrapper">
                                    <table className="data-table">
                                        <thead>
                                            <tr>
                                                <th>Organisation Name</th>
                                                <th>Year</th>
                                                <th>Town</th>
                                                <th>Industry</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tableData.map((row, idx) => (
                                                <tr key={idx}>
                                                    <td>{row['Organisation Name']}</td>
                                                    <td>{row.year}</td>
                                                    <td>{row.town}</td>
                                                    <td>{row.Industry}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="footer">
                        Created by <strong>Anjaney Singh</strong> with <strong>Claude</strong> | Data sources: <a href="https://uktiersponsors.co.uk/" target="_blank">UK Tier Sponsors</a>, <a href="https://geoportal.statistics.gov.uk/" target="_blank">ONS Geoportal</a>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>
</body>
</html>
