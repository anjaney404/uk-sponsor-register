<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Tier 2 Visa Sponsors</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #0a0a0a;
        }

        .top-bar {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .top-bar h1 {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
        }

        .top-bar-search button {
            padding: 8px 15px;
            background: #4a90e2;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-weight: 600;
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
        }

        .top-bar-search button:hover {
            background: #3a7bc8;
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            padding: 15px;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar {
            width: clamp(220px, 20vw, 350px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .filter-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            flex-shrink: 0;
        }

        .filter-card h3 {
            color: #fff;
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .kpi-value {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            text-align: center;
            color: #fff;
            margin: 10px 0;
        }

        .date-inputs {
            display: flex;
            gap: 8px;
        }

        .date-inputs input {
            flex: 1;
            padding: 6px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            font-size: 0.75rem;
            border-radius: 3px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
            cursor: pointer;
        }

        .checkbox-item input {
            width: 14px;
            height: 14px;
            accent-color: #fff;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            color: #ccc;
            font-size: 0.8rem;
        }

        .filter-input {
            width: 100%;
            padding: 6px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            font-size: 0.8rem;
            margin-bottom: 8px;
            border-radius: 3px;
        }

        .filter-card.industry-card,
        .filter-card.region-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 250px;
            max-height: none;
            overflow: hidden;
        }

        .filter-card.industry-card .checkbox-group,
        .filter-card.region-card .checkbox-group {
            flex: 1;
            max-height: none;
        }

        .content {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            min-height: 0;
            overflow: hidden;
        }

        .content > .table-container {
            grid-column: 1 / -1;
            min-height: 0;
        }

        .chart-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .chart-container h2 {
            margin-bottom: 12px;
            color: #fff;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            font-weight: 700;
            flex-shrink: 0;
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 10px;
            min-height: 0;
            overflow: hidden;
        }

        svg {
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .clickable-bar:hover {
            opacity: 0.7;
        }

        .region-bars {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            width: 100%;
        }

        .region-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-bar-label {
            min-width: 100px;
            font-size: 0.75rem;
            color: #ccc;
            text-align: right;
        }

        .region-bar-fill {
            flex: 1;
            background: #4a90e2;
            height: 24px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .region-bar-fill:hover {
            background: #3a7bc8;
            opacity: 0.9;
        }

        .region-bar-fill.selected {
            background: #2a6bb8;
            border: 1px solid #4a90e2;
        }

        .pie-chart {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .pie-legend {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .growth-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid #333;
            font-size: 0.75rem;
        }

        .growth-label {
            flex: 1;
            color: #ccc;
            min-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .growth-bar-fill {
            background: #4a90e2;
            height: 20px;
            border-radius: 2px;
            min-width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .town-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            border-bottom: 1px solid #333;
            font-size: 0.75rem;
        }

        .town-rank {
            color: #999;
            min-width: 25px;
            font-weight: 700;
        }

        .town-name {
            flex: 1;
            color: #ccc;
        }

        .town-count {
            color: #4a90e2;
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        .table-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .table-header h2 {
            font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            font-weight: 700;
            color: #fff;
            flex: 1;
        }

        .table-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .table-search {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .table-search input {
            flex: 1;
            padding: 6px 10px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 3px;
            color: #000;
            font-size: 0.8rem;
        }

        .items-per-page {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
        }

        .items-per-page select {
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .sort-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .sort-btn {
            padding: 5px 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .sort-btn:hover {
            background: #444;
        }

        .sort-btn.active {
            background: #4a90e2;
            border-color: #2a7bc8;
        }

        .table-nav {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-btn {
            padding: 5px 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            font-weight: 600;
            white-space: nowrap;
        }

        .nav-btn:hover:not(:disabled) {
            background: #444;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            color: #999;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            padding: 0 5px;
            white-space: nowrap;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 3px;
            background: #0a0a0a;
            min-height: 0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.7rem, 1.2vw, 0.85rem);
        }

        .data-table thead {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .data-table th {
            padding: 8px;
            text-align: left;
            color: #00d4ff;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            cursor: pointer;
            user-select: none;
        }

        .data-table th:hover {
            background: #2a2a2a;
        }

        .data-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #333;
            color: #ccc;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-table tbody tr:hover {
            background: rgba(74, 144, 226, 0.05);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 15px 20px;
            text-align: center;
            color: #999;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            flex-shrink: 0;
        }

        .footer a {
            color: #4a90e2;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1400px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 35vh;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
            }

            .filter-card.industry-card,
            .filter-card.region-card {
                min-height: auto;
                max-height: 250px;
            }

            .content {
                grid-template-columns: repeat(2, 1fr);
                max-height: 55vh;
            }
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                gap: 10px;
            }

            .main-content {
                padding: 10px;
                gap: 10px;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .table-header {
                flex-direction: column;
                align-items: stretch;
            }

            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .table-search {
                min-width: auto;
            }

            .table-nav {
                width: 100%;
                justify-content: space-between;
            }

            .pie-legend {
                flex-direction: column;
                gap: 8px;
            }

            .region-bar-label {
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard() {
            const [sponsorData, setSponsorData] = useState([]);
            const [locationData, setLocationData] = useState({});
            const [loading, setLoading] = useState(true);
            const [currentPage, setCurrentPage] = useState(1);
            const [itemsPerPage, setItemsPerPage] = useState(50);
            const [sortBy, setSortBy] = useState('name');
            const [sortOrder, setSortOrder] = useState('asc');

            const [filters, setFilters] = useState({
                searchOrg: '',
                searchIndustry: '',
                searchRegion: '',
                regions: [],
                industries: [],
                years: [],
                startYear: 2013,
                endYear: 2026
            });

            useEffect(() => {
                async function loadData() {
                    try {
                        const sponsorResponse = await fetch('data/uk_sponsor_register.csv');
                        const sponsorText = await sponsorResponse.text();
                        
                        Papa.parse(sponsorText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setSponsorData(results.data);
                            }
                        });

                        const locationResponse = await fetch('data/IPN_GB_2022.csv');
                        const locationText = await locationResponse.text();
                        
                        Papa.parse(locationText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                const locMap = {};
                                results.data.forEach(row => {
                                    if (row.placesort) {
                                        locMap[row.placesort.toLowerCase()] = {
                                            ee21nm: row.eer21nm
                                        };
                                    }
                                });
                                setLocationData(locMap);
                                setLoading(false);
                            }
                        });
                    } catch (error) {
                        console.error('Error loading data:', error);
                        setLoading(false);
                    }
                }

                loadData();
            }, []);

            const processedData = useMemo(() => {
                if (!sponsorData.length) return [];

                return sponsorData.map(row => {
                    const dateAdded = new Date(row['Date Added']);
                    const year = dateAdded.getFullYear();
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};

                    return {
                        ...row,
                        year,
                        region: locInfo.ee21nm || 'Unknown',
                        town: row.Town || 'Unknown'
                    };
                }).filter(row => {
                    const matchesOrg = row['Organisation Name']?.toLowerCase().includes(filters.searchOrg.toLowerCase());
                    const matchesIndustry = row.Industry?.toLowerCase().includes(filters.searchIndustry.toLowerCase());
                    const matchesRegion = filters.regions.length === 0 || filters.regions.includes(row.region);
                    const matchesIndList = filters.industries.length === 0 || filters.industries.includes(row.Industry);
                    const matchesYear = filters.years.length === 0 || filters.years.includes(row.year);
                    const matchesDateRange = row.year >= filters.startYear && row.year <= filters.endYear;

                    return matchesOrg && matchesIndustry && matchesRegion && matchesIndList && matchesYear && matchesDateRange;
                });
            }, [sponsorData, locationData, filters]);

            // Sort data
            const sortedData = useMemo(() => {
                const sorted = [...processedData];
                sorted.sort((a, b) => {
                    let aVal, bVal;
                    switch(sortBy) {
                        case 'name': aVal = a['Organisation Name'] || ''; bVal = b['Organisation Name'] || ''; break;
                        case 'year': aVal = a.year || 0; bVal = b.year || 0; break;
                        case 'town': aVal = a.town || ''; bVal = b.town || ''; break;
                        case 'industry': aVal = a.Industry || ''; bVal = b.Industry || ''; break;
                        default: aVal = a['Organisation Name']; bVal = b['Organisation Name'];
                    }
                    if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                    if (typeof bVal === 'string') bVal = bVal.toLowerCase();
                    if (aVal < bVal) return sortOrder === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });
                return sorted;
            }, [processedData, sortBy, sortOrder]);

            useEffect(() => {
                setCurrentPage(1);
            }, [sortedData, itemsPerPage]);

            const totalPages = Math.ceil(sortedData.length / itemsPerPage);
            const startIdx = (currentPage - 1) * itemsPerPage;
            const tableData = sortedData.slice(startIdx, startIdx + itemsPerPage);

            const uniqueRegions = useMemo(() => {
                const regions = new Set(sponsorData.map(row => {
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};
                    return locInfo.ee21nm || 'Unknown';
                }));
                return Array.from(regions).filter(r => r !== 'Unknown').sort();
            }, [sponsorData, locationData]);

            const uniqueIndustries = useMemo(() => {
                return Array.from(new Set(sponsorData.map(row => row.Industry))).filter(Boolean).sort();
            }, [sponsorData]);

            const yearData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    grouped[row.year] = (grouped[row.year] || 0) + 1;
                });
                return Object.entries(grouped).sort().map(([year, count]) => ({
                    year: parseInt(year),
                    count
                }));
            }, [processedData]);

            const regionData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    if (!grouped[row.region]) {
                        grouped[row.region] = { region: row.region, count: 0 };
                    }
                    grouped[row.region].count += 1;
                });
                return Object.values(grouped).sort((a, b) => b.count - a.count);
            }, [processedData]);

            // Tier Distribution (Main Tier only - no Sub Tier)
            const tierData = useMemo(() => {
                const mainTier = processedData.filter(r => r['Main Tier'] && r['Main Tier'].trim()).length;
                return { mainTier, other: processedData.length - mainTier, total: processedData.length };
            }, [processedData]);

            // Top Growth Industries (2025-2026)
            const growthIndustries = useMemo(() => {
                const recent = processedData.filter(r => r.year >= 2025);
                const grouped = {};
                recent.forEach(row => {
                    grouped[row.Industry] = (grouped[row.Industry] || 0) + 1;
                });
                return Object.entries(grouped).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([ind, count]) => ({
                    industry: ind,
                    count
                }));
            }, [processedData]);

            // Top Towns
            const topTowns = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    grouped[row.town] = (grouped[row.town] || 0) + 1;
                });
                return Object.entries(grouped).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([town, count]) => ({
                    town,
                    count
                }));
            }, [processedData]);

            const resetFilters = () => {
                setFilters({
                    searchOrg: '',
                    searchIndustry: '',
                    searchRegion: '',
                    regions: [],
                    industries: [],
                    years: [],
                    startYear: 2013,
                    endYear: 2026
                });
                setCurrentPage(1);
            };

            if (loading) {
                return <div className="loading"><div className="spinner"></div></div>;
            }

            return (
                <div className="dashboard">
                    <div className="top-bar">
                        <h1>UK Tier 2 Visa Sponsors</h1>
                        <div className="top-bar-search">
                            <button onClick={resetFilters}>Reset Filters</button>
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="sidebar">
                            <div className="filter-card">
                                <h3>Total Organisations Found</h3>
                                <div className="kpi-value">{processedData.length.toLocaleString()}</div>
                            </div>

                            <div className="filter-card">
                                <h3>Registration Date</h3>
                                <div className="date-inputs">
                                    <input type="number" min="2013" max="2026" value={filters.startYear} onChange={(e) => setFilters({...filters, startYear: parseInt(e.target.value)})} />
                                    <input type="number" min="2013" max="2026" value={filters.endYear} onChange={(e) => setFilters({...filters, endYear: parseInt(e.target.value)})} />
                                </div>
                            </div>

                            <div className="filter-card region-card">
                                <h3>Region</h3>
                                <input type="text" className="filter-input" placeholder="Search region..." value={filters.searchRegion} onChange={(e) => setFilters({...filters, searchRegion: e.target.value})} />
                                <div className="checkbox-group">
                                    {uniqueRegions.filter(reg => reg.toLowerCase().includes(filters.searchRegion.toLowerCase())).map(region => (
                                        <div key={region} className="checkbox-item">
                                            <input type="checkbox" checked={filters.regions.includes(region)} onChange={(e) => {
                                                if (e.target.checked) {
                                                    setFilters({...filters, regions: [...filters.regions, region]});
                                                } else {
                                                    setFilters({...filters, regions: filters.regions.filter(r => r !== region)});
                                                }
                                            }} />
                                            <label>{region}</label>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="filter-card industry-card">
                                <h3>Industry</h3>
                                <input type="text" className="filter-input" placeholder="Search industry..." value={filters.searchIndustry} onChange={(e) => setFilters({...filters, searchIndustry: e.target.value})} />
                                <div className="checkbox-group">
                                    {uniqueIndustries.filter(ind => ind.toLowerCase().includes(filters.searchIndustry.toLowerCase())).map(industry => (
                                        <div key={industry} className="checkbox-item">
                                            <input type="checkbox" checked={filters.industries.includes(industry)} onChange={(e) => {
                                                if (e.target.checked) {
                                                    setFilters({...filters, industries: [...filters.industries, industry]});
                                                } else {
                                                    setFilters({...filters, industries: filters.industries.filter(i => i !== industry)});
                                                }
                                            }} />
                                            <label>{industry}</label>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="content">
                            <div className="chart-container">
                                <h2>Registrations by Year</h2>
                                <div className="chart-wrapper">
                                    <svg viewBox="0 0 500 300" preserveAspectRatio="xMidYMid meet">
                                        {yearData.map((d, i) => {
                                            const maxCount = Math.max(...yearData.map(x => x.count), 1);
                                            const barHeight = (d.count / maxCount) * 220;
                                            const x = (i * (460 / yearData.length)) + 20;
                                            const y = 260 - barHeight;
                                            return (
                                                <g key={i} className="clickable-bar" onClick={() => {
                                                    if (filters.years.includes(d.year)) {
                                                        setFilters({...filters, years: filters.years.filter(yr => yr !== d.year)});
                                                    } else {
                                                        setFilters({...filters, years: [...filters.years, d.year]});
                                                    }
                                                }}>
                                                    <rect x={x} y={y} width={Math.max(1, (460 / yearData.length) - 2)} height={barHeight} fill="#4a90e2" />
                                                    <text x={x + (460 / yearData.length) / 2} y={280} textAnchor="middle" fill="#666" fontSize="10">{d.year}</text>
                                                    <text x={x + (460 / yearData.length) / 2} y={y - 3} textAnchor="middle" fill="#fff" fontSize="8" fontWeight="bold">{d.count}</text>
                                                </g>
                                            );
                                        })}
                                    </svg>
                                </div>
                            </div>

                            <div className="chart-container">
                                <h2>Sponsors by Region</h2>
                                <div className="region-bars">
                                    {regionData.map(region => {
                                        const maxCount = regionData[0]?.count || 1;
                                        const width = (region.count / maxCount) * 100;
                                        const isSelected = filters.regions.includes(region.region);
                                        return (
                                            <div key={region.region} className="region-bar">
                                                <div className="region-bar-label">{region.region}</div>
                                                <div 
                                                    className={`region-bar-fill ${isSelected ? 'selected' : ''}`}
                                                    style={{width: `${width}%`}}
                                                    onClick={() => {
                                                        if (filters.regions.includes(region.region)) {
                                                            setFilters({...filters, regions: filters.regions.filter(r => r !== region.region)});
                                                        } else {
                                                            setFilters({...filters, regions: [...filters.regions, region.region]});
                                                        }
                                                    }}
                                                >
                                                    {region.count}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="chart-container">
                                <h2>Main Tier Distribution</h2>
                                <div className="pie-chart">
                                    <svg viewBox="0 0 200 150" style={{width: '100%', maxWidth: '150px'}}>
                                        <circle cx="75" cy="75" r="50" fill="#4a90e2" />
                                        <circle cx="75" cy="75" r="40" fill="#0a0a0a" />
                                        <text x="75" y="75" textAnchor="middle" dominantBaseline="middle" fill="#fff" fontSize="20" fontWeight="bold">
                                            {Math.round((tierData.mainTier / tierData.total) * 100)}%
                                        </text>
                                    </svg>
                                    <div className="pie-legend">
                                        <div className="legend-item">
                                            <div className="legend-color" style={{background: '#4a90e2'}}></div>
                                            <span>Main Tier: {tierData.mainTier}</span>
                                        </div>
                                        <div className="legend-item">
                                            <div className="legend-color" style={{background: '#666'}}></div>
                                            <span>Others: {tierData.other}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="chart-container">
                                <h2>Top Growth Industries (2025-2026)</h2>
                                <div className="chart-wrapper" style={{flexDirection: 'column', padding: '5px', justifyContent: 'flex-start'}}>
                                    {growthIndustries.map((ind, i) => {
                                        const maxCount = growthIndustries[0]?.count || 1;
                                        const width = (ind.count / maxCount) * 100;
                                        return (
                                            <div key={i} className="growth-bar">
                                                <div className="growth-label" title={ind.industry}>{ind.industry}</div>
                                                <div className="growth-bar-fill" style={{width: `${width}%`, minWidth: '30px'}}>{ind.count}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="chart-container">
                                <h2>Top Towns by Sponsors</h2>
                                <div className="chart-wrapper" style={{flexDirection: 'column', padding: '5px', justifyContent: 'flex-start'}}>
                                    {topTowns.map((town, i) => (
                                        <div key={i} className="town-item">
                                            <div className="town-rank">#{i + 1}</div>
                                            <div className="town-name">{town.town}</div>
                                            <div className="town-count">{town.count}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="table-container">
                                <div className="table-header">
                                    <h2>Organisations (Showing {startIdx + 1}-{Math.min(startIdx + itemsPerPage, sortedData.length)} of {sortedData.length.toLocaleString()})</h2>
                                    <div className="table-controls">
                                        <div className="table-search">
                                            <input
                                                type="text"
                                                placeholder="Search organisation..."
                                                value={filters.searchOrg}
                                                onChange={(e) => setFilters({...filters, searchOrg: e.target.value})}
                                            />
                                        </div>
                                        <div className="items-per-page">
                                            <label>Per Page:</label>
                                            <select value={itemsPerPage} onChange={(e) => setItemsPerPage(parseInt(e.target.value))}>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                                <option value="250">250</option>
                                            </select>
                                        </div>
                                        <div className="table-nav">
                                            <button className="nav-btn" onClick={() => setCurrentPage(1)} disabled={currentPage === 1}>⏮</button>
                                            <button className="nav-btn" onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1}>◀</button>
                                            <span className="page-info">{currentPage} / {totalPages}</span>
                                            <button className="nav-btn" onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages}>▶</button>
                                            <button className="nav-btn" onClick={() => setCurrentPage(totalPages)} disabled={currentPage === totalPages}>⏭</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="table-wrapper">
                                    <table className="data-table">
                                        <thead>
                                            <tr>
                                                <th onClick={() => {setSortBy('name'); setSortOrder(sortBy === 'name' && sortOrder === 'asc' ? 'desc' : 'asc');}}>Organisation {sortBy === 'name' && (sortOrder === 'asc' ? '▲' : '▼')}</th>
                                                <th onClick={() => {setSortBy('year'); setSortOrder(sortBy === 'year' && sortOrder === 'asc' ? 'desc' : 'asc');}}>Year {sortBy === 'year' && (sortOrder === 'asc' ? '▲' : '▼')}</th>
                                                <th onClick={() => {setSortBy('town'); setSortOrder(sortBy === 'town' && sortOrder === 'asc' ? 'desc' : 'asc');}}>Town {sortBy === 'town' && (sortOrder === 'asc' ? '▲' : '▼')}</th>
                                                <th onClick={() => {setSortBy('industry'); setSortOrder(sortBy === 'industry' && sortOrder === 'asc' ? 'desc' : 'asc');}}>Industry {sortBy === 'industry' && (sortOrder === 'asc' ? '▲' : '▼')}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tableData.map((row, idx) => (
                                                <tr key={idx}>
                                                    <td>{row['Organisation Name']}</td>
                                                    <td>{row.year}</td>
                                                    <td>{row.town}</td>
                                                    <td>{row.Industry}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="footer">
                        Designed & Developed by <strong>Anjaney Singh</strong> using <strong>Claude AI</strong> | Data sources: <a href="https://uktiersponsors.co.uk/" target="_blank">UK Tier Sponsors</a>, <a href="https://geoportal.statistics.gov.uk/" target="_blank">ONS Geoportal</a>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>
</body>
</html>
