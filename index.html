<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Visa Sponsor Register</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --border-color: #333333;
            --accent-primary: #00d4ff;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .dashboard-container {
            min-height: 100vh;
            background: var(--bg-primary);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .kpi-card {
            text-align: center;
            border: 2px solid var(--border-color);
            padding: 30px 20px;
        }

        .kpi-card h3 {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .filter-section h3 {
            color: var(--text-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--text-primary);
        }

        .date-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .date-inputs input {
            flex: 1;
            padding: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .checkbox-item input {
            cursor: pointer;
            accent-color: var(--text-primary);
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .filter-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .content > .full-width {
            grid-column: 1 / -1;
        }

        .chart-card {
            position: relative;
        }

        .chart-card h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .chart-wrapper {
            width: 100%;
            min-height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
        }

        svg {
            cursor: pointer;
        }

        .clickable-bar:hover {
            opacity: 0.7;
        }

        .table-wrapper {
            width: 100%;
            max-height: 500px;
            border-radius: 4px;
            overflow: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            border-bottom: 2px solid var(--text-primary);
        }

        .data-table th {
            padding: 12px;
            text-align: left;
            color: var(--accent-primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.75rem;
        }

        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .region-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .region-card {
            padding: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .region-card:hover {
            border-color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .region-card.selected {
            border-color: var(--accent-primary);
            background: rgba(0, 212, 255, 0.1);
        }

        .region-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .region-count {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
            }

            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard() {
            const [sponsorData, setSponsorData] = useState([]);
            const [locationData, setLocationData] = useState({});
            const [loading, setLoading] = useState(true);
            const [filters, setFilters] = useState({
                searchOrg: '',
                searchIndustry: '',
                regions: [],
                industries: [],
                years: [],
                startYear: 2013,
                endYear: 2026
            });

            // Load CSV data
            useEffect(() => {
                async function loadData() {
                    try {
                        const sponsorResponse = await fetch('data/uk_sponsor_register.csv');
                        const sponsorText = await sponsorResponse.text();
                        
                        Papa.parse(sponsorText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setSponsorData(results.data);
                            }
                        });

                        const locationResponse = await fetch('data/IPN_GB_2022.csv');
                        const locationText = await locationResponse.text();
                        
                        Papa.parse(locationText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                const locMap = {};
                                results.data.forEach(row => {
                                    if (row.placesort) {
                                        locMap[row.placesort.toLowerCase()] = {
                                            placesort: row.placesort,
                                            ee21nm: row.eer21nm,
                                            lat: parseFloat(row.lat),
                                            long: parseFloat(row.long)
                                        };
                                    }
                                });
                                setLocationData(locMap);
                                setLoading(false);
                            }
                        });
                    } catch (error) {
                        console.error('Error loading data:', error);
                        setLoading(false);
                    }
                }

                loadData();
            }, []);

            // Process and filter data
            const processedData = useMemo(() => {
                if (!sponsorData.length) return [];

                return sponsorData.map(row => {
                    const dateAdded = new Date(row['Date Added']);
                    const year = dateAdded.getFullYear();
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};

                    return {
                        ...row,
                        year,
                        dateAdded,
                        region: locInfo.ee21nm || 'Unknown',
                        lat: locInfo.lat,
                        lon: locInfo.long,
                        town: row.Town || 'Unknown'
                    };
                }).filter(row => {
                    const matchesOrg = row['Organisation Name']?.toLowerCase().includes(filters.searchOrg.toLowerCase());
                    const matchesIndustry = row.Industry?.toLowerCase().includes(filters.searchIndustry.toLowerCase());
                    const matchesRegion = filters.regions.length === 0 || filters.regions.includes(row.region);
                    const matchesIndList = filters.industries.length === 0 || filters.industries.includes(row.Industry);
                    const matchesYear = filters.years.length === 0 || filters.years.includes(row.year);

                    return matchesOrg && matchesIndustry && matchesRegion && matchesIndList && matchesYear;
                });
            }, [sponsorData, locationData, filters]);

            // Get unique values
            const uniqueRegions = useMemo(() => {
                const regions = new Set(sponsorData.map(row => {
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};
                    return locInfo.ee21nm || 'Unknown';
                }));
                return Array.from(regions).filter(r => r !== 'Unknown').sort();
            }, [sponsorData, locationData]);

            const uniqueIndustries = useMemo(() => {
                return Array.from(new Set(sponsorData.map(row => row.Industry))).filter(Boolean).sort();
            }, [sponsorData]);

            // Chart data
            const yearData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    grouped[row.year] = (grouped[row.year] || 0) + 1;
                });
                return Object.entries(grouped).sort().map(([year, count]) => ({
                    year: parseInt(year),
                    count
                }));
            }, [processedData]);

            const industryCount = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    grouped[row.Industry] = (grouped[row.Industry] || 0) + 1;
                });
                return Object.entries(grouped)
                    .map(([name, value]) => ({ name, value }))
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 10);
            }, [processedData]);

            const regionData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    if (!grouped[row.region]) {
                        grouped[row.region] = { region: row.region, count: 0 };
                    }
                    grouped[row.region].count += 1;
                });
                return Object.values(grouped).sort((a, b) => b.count - a.count);
            }, [processedData]);

            const tableData = processedData.slice(0, 50);

            if (loading) {
                return (
                    <div className="dashboard-container">
                        <div className="loading">
                            <div className="spinner"></div>
                            <p style={{ marginTop: '20px' }}>Loading dashboard...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="dashboard-container">
                    <div className="header">
                        <h1>UK Visa Sponsor Register</h1>
                        <p>Interactive Dashboard of Organisations Offering Sponsorship</p>
                    </div>

                    <div className="main-layout">
                        {/* SIDEBAR */}
                        <div className="sidebar">
                            {/* KPI */}
                            <div className="card kpi-card">
                                <h3>Total Organisations Found</h3>
                                <div className="kpi-value">{processedData.length.toLocaleString()}</div>
                            </div>

                            {/* Date Filter */}
                            <div className="card filter-section">
                                <h3>Registration Date</h3>
                                <div className="date-inputs">
                                    <input
                                        type="number"
                                        min="2013"
                                        max="2026"
                                        value={filters.startYear}
                                        onChange={(e) => setFilters({...filters, startYear: parseInt(e.target.value)})}
                                    />
                                    <input
                                        type="number"
                                        min="2013"
                                        max="2026"
                                        value={filters.endYear}
                                        onChange={(e) => setFilters({...filters, endYear: parseInt(e.target.value)})}
                                    />
                                </div>
                            </div>

                            {/* Region Filter */}
                            <div className="card filter-section">
                                <h3>Region</h3>
                                <div className="checkbox-group">
                                    {uniqueRegions.map(region => (
                                        <div key={region} className="checkbox-item">
                                            <input
                                                type="checkbox"
                                                id={`region-${region}`}
                                                checked={filters.regions.includes(region)}
                                                onChange={(e) => {
                                                    if (e.target.checked) {
                                                        setFilters({...filters, regions: [...filters.regions, region]});
                                                    } else {
                                                        setFilters({...filters, regions: filters.regions.filter(r => r !== region)});
                                                    }
                                                }}
                                            />
                                            <label htmlFor={`region-${region}`}>{region}</label>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Industry Filter */}
                            <div className="card filter-section">
                                <h3>Industry</h3>
                                <input
                                    type="text"
                                    className="filter-input"
                                    placeholder="Search industry..."
                                    value={filters.searchIndustry}
                                    onChange={(e) => setFilters({...filters, searchIndustry: e.target.value})}
                                />
                                <div className="checkbox-group">
                                    {uniqueIndustries
                                        .filter(ind => ind.toLowerCase().includes(filters.searchIndustry.toLowerCase()))
                                        .map(industry => (
                                            <div key={industry} className="checkbox-item">
                                                <input
                                                    type="checkbox"
                                                    id={`ind-${industry}`}
                                                    checked={filters.industries.includes(industry)}
                                                    onChange={(e) => {
                                                        if (e.target.checked) {
                                                            setFilters({...filters, industries: [...filters.industries, industry]});
                                                        } else {
                                                            setFilters({...filters, industries: filters.industries.filter(i => i !== industry)});
                                                        }
                                                    }}
                                                />
                                                <label htmlFor={`ind-${industry}`}>{industry}</label>
                                            </div>
                                        ))}
                                </div>
                            </div>

                            {/* Organisation Search */}
                            <div className="card filter-section">
                                <h3>Organisation</h3>
                                <input
                                    type="text"
                                    className="filter-input"
                                    placeholder="Enter Organisation Name"
                                    value={filters.searchOrg}
                                    onChange={(e) => setFilters({...filters, searchOrg: e.target.value})}
                                />
                            </div>
                        </div>

                        {/* CONTENT */}
                        <div className="content">
                            {/* Map / Regions by Year */}
                            <div className="card chart-card">
                                <h3>Industries by Year of Registration</h3>
                                <div className="chart-wrapper">
                                    <svg viewBox="0 0 450 300" style={{ width: '100%', height: '100%' }}>
                                        {yearData.map((d, i) => {
                                            const maxCount = Math.max(...yearData.map(x => x.count), 1);
                                            const barHeight = (d.count / maxCount) * 220;
                                            const x = (i * (410 / yearData.length)) + 30;
                                            const y = 260 - barHeight;
                                            return (
                                                <g key={i} className="clickable-bar" onClick={() => {
                                                    if (filters.years.includes(d.year)) {
                                                        setFilters({...filters, years: filters.years.filter(y => y !== d.year)});
                                                    } else {
                                                        setFilters({...filters, years: [...filters.years, d.year]});
                                                    }
                                                }}>
                                                    <rect x={x} y={y} width={Math.max(1, (410 / yearData.length) - 2)} height={barHeight} fill="#333333" />
                                                    <text x={x + (410 / yearData.length) / 2} y={280} textAnchor="middle" fill="#888888" fontSize="11">{d.year}</text>
                                                    <text x={x + (410 / yearData.length) / 2} y={y - 5} textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="bold">{d.count}</text>
                                                </g>
                                            );
                                        })}
                                    </svg>
                                </div>
                            </div>

                            {/* Top Industries */}
                            <div className="card chart-card">
                                <h3>Top Industries</h3>
                                <div className="chart-wrapper">
                                    <svg viewBox="0 0 450 300" style={{ width: '100%', height: '100%' }}>
                                        {industryCount.map((d, i) => {
                                            const maxValue = Math.max(...industryCount.map(x => x.value), 1);
                                            const barWidth = (d.value / maxValue) * 320;
                                            const y = (i * (270 / industryCount.length)) + 15;
                                            return (
                                                <g key={i} className="clickable-bar" onClick={() => {
                                                    if (filters.industries.includes(d.name)) {
                                                        setFilters({...filters, industries: filters.industries.filter(ind => ind !== d.name)});
                                                    } else {
                                                        setFilters({...filters, industries: [...filters.industries, d.name]});
                                                    }
                                                }}>
                                                    <rect x="100" y={y} width={barWidth} height="18" fill="#333333" />
                                                    <text x="95" y={y + 13} textAnchor="end" fill="#888888" fontSize="9">{d.name.substring(0, 12)}</text>
                                                    <text x={100 + barWidth + 5} y={y + 13} fill="#ffffff" fontSize="9" fontWeight="bold">{d.value.toLocaleString()}</text>
                                                </g>
                                            );
                                        })}
                                    </svg>
                                </div>
                            </div>

                            {/* Industries by Region */}
                            <div className="card chart-card full-width">
                                <h3>Industries by Region</h3>
                                <div className="region-grid">
                                    {regionData.map((region, idx) => {
                                        const isSelected = filters.regions.includes(region.region);
                                        const maxCount = Math.max(...regionData.map(r => r.count), 1);
                                        const percentage = (region.count / maxCount) * 100;
                                        return (
                                            <div 
                                                key={idx} 
                                                className={`region-card ${isSelected ? 'selected' : ''}`}
                                                onClick={() => {
                                                    if (filters.regions.includes(region.region)) {
                                                        setFilters({...filters, regions: filters.regions.filter(r => r !== region.region)});
                                                    } else {
                                                        setFilters({...filters, regions: [...filters.regions, region.region]});
                                                    }
                                                }}
                                            >
                                                <div className="region-name">{region.region}</div>
                                                <div className="region-count">{region.count}</div>
                                                <div style={{ height: '3px', background: '#444444', marginTop: '8px', borderRadius: '2px' }}>
                                                    <div style={{ height: '100%', background: '#ffffff', width: `${percentage}%`, borderRadius: '2px' }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Data Table */}
                            <div className="card chart-card full-width">
                                <h3>Organisation Name (Showing {tableData.length} of {processedData.length})</h3>
                                <div className="table-wrapper">
                                    <table className="data-table">
                                        <thead>
                                            <tr>
                                                <th>Organisation Name</th>
                                                <th>Year</th>
                                                <th>Town</th>
                                                <th>Industry</th>
                                                <th>Tier</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tableData.map((row, idx) => (
                                                <tr key={idx}>
                                                    <td>{row['Organisation Name']}</td>
                                                    <td>{row.year}</td>
                                                    <td>{row.town}</td>
                                                    <td>{row.Industry}</td>
                                                    <td>{row['Main Tier'] || '-'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>
</body>
</html>
