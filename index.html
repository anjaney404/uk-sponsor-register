<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Visa Sponsor Register</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            line-height: 1.6;
        }

        .dashboard-container {
            min-height: 100vh;
            background: #1a1a1a;
            padding: 20px;
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 20px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
            padding: 20px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .header-search {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .header-search input {
            padding: 10px 15px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
            font-size: 0.9rem;
            color: #000;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            grid-row: 2;
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
        }

        .kpi-card {
            text-align: center;
            border: 2px solid #333;
            padding: 20px 15px;
        }

        .kpi-card h3 {
            color: #999;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .filter-section h3 {
            color: #ffffff;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .date-inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .date-inputs input {
            flex: 1;
            padding: 6px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.8rem;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px;
            border-radius: 3px;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .checkbox-item input {
            cursor: pointer;
            accent-color: #ffffff;
            width: 14px;
            height: 14px;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 0.8rem;
            color: #ccc;
        }

        .filter-input {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            grid-column: 2;
            grid-row: 2;
        }

        .content > .full-width {
            grid-column: 1 / -1;
        }

        .chart-card {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chart-card h3 {
            margin-bottom: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            min-height: 300px;
        }

        svg {
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .clickable-bar:hover {
            opacity: 0.7;
        }

        #map-container {
            width: 100%;
            height: 350px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1a1a1a;
        }

        .leaflet-container {
            background: #1a1a1a !important;
            border-radius: 4px;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1a1a1a;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            background: #0a0a0a;
            border-bottom: 1px solid #333;
        }

        .data-table th {
            padding: 10px;
            text-align: left;
            color: #00d4ff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.75rem;
        }

        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            color: #ccc;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .pagination button {
            padding: 6px 12px;
            background: #333;
            border: 1px solid #555;
            color: #ffffff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .pagination button:hover {
            background: #444;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            color: #999;
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            grid-column: 1 / -1;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard() {
            const [sponsorData, setSponsorData] = useState([]);
            const [locationData, setLocationData] = useState({});
            const [loading, setLoading] = useState(true);
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 50;

            const [filters, setFilters] = useState({
                searchOrg: '',
                searchIndustry: '',
                regions: [],
                industries: [],
                years: [],
                startYear: 2013,
                endYear: 2026
            });

            // Load CSV data
            useEffect(() => {
                async function loadData() {
                    try {
                        const sponsorResponse = await fetch('data/uk_sponsor_register.csv');
                        const sponsorText = await sponsorResponse.text();
                        
                        Papa.parse(sponsorText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setSponsorData(results.data);
                            }
                        });

                        const locationResponse = await fetch('data/IPN_GB_2022.csv');
                        const locationText = await locationResponse.text();
                        
                        Papa.parse(locationText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                const locMap = {};
                                results.data.forEach(row => {
                                    if (row.placesort) {
                                        locMap[row.placesort.toLowerCase()] = {
                                            placesort: row.placesort,
                                            ee21nm: row.eer21nm,
                                            lat: parseFloat(row.lat),
                                            long: parseFloat(row.long)
                                        };
                                    }
                                });
                                setLocationData(locMap);
                                setLoading(false);
                            }
                        });
                    } catch (error) {
                        console.error('Error loading data:', error);
                        setLoading(false);
                    }
                }

                loadData();
            }, []);

            // Process and filter data
            const processedData = useMemo(() => {
                if (!sponsorData.length) return [];

                return sponsorData.map(row => {
                    const dateAdded = new Date(row['Date Added']);
                    const year = dateAdded.getFullYear();
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};

                    return {
                        ...row,
                        year,
                        dateAdded,
                        region: locInfo.ee21nm || 'Unknown',
                        lat: locInfo.lat,
                        lon: locInfo.long,
                        town: row.Town || 'Unknown'
                    };
                }).filter(row => {
                    const matchesOrg = row['Organisation Name']?.toLowerCase().includes(filters.searchOrg.toLowerCase());
                    const matchesIndustry = row.Industry?.toLowerCase().includes(filters.searchIndustry.toLowerCase());
                    const matchesRegion = filters.regions.length === 0 || filters.regions.includes(row.region);
                    const matchesIndList = filters.industries.length === 0 || filters.industries.includes(row.Industry);
                    const matchesYear = filters.years.length === 0 || filters.years.includes(row.year);
                    const matchesDateRange = row.year >= filters.startYear && row.year <= filters.endYear;

                    return matchesOrg && matchesIndustry && matchesRegion && matchesIndList && matchesYear && matchesDateRange;
                });
            }, [sponsorData, locationData, filters]);

            // Reset pagination when data changes
            useEffect(() => {
                setCurrentPage(1);
            }, [processedData]);

            // Pagination
            const totalPages = Math.ceil(processedData.length / itemsPerPage);
            const startIdx = (currentPage - 1) * itemsPerPage;
            const tableData = processedData.slice(startIdx, startIdx + itemsPerPage);

            // Get unique values
            const uniqueRegions = useMemo(() => {
                const regions = new Set(sponsorData.map(row => {
                    const townKey = (row.Town || '').toLowerCase().trim();
                    const locInfo = locationData[townKey] || {};
                    return locInfo.ee21nm || 'Unknown';
                }));
                return Array.from(regions).filter(r => r !== 'Unknown').sort();
            }, [sponsorData, locationData]);

            const uniqueIndustries = useMemo(() => {
                return Array.from(new Set(sponsorData.map(row => row.Industry))).filter(Boolean).sort();
            }, [sponsorData]);

            // Chart data
            const yearData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    grouped[row.year] = (grouped[row.year] || 0) + 1;
                });
                return Object.entries(grouped).sort().map(([year, count]) => ({
                    year: parseInt(year),
                    count
                }));
            }, [processedData]);

            const regionData = useMemo(() => {
                const grouped = {};
                processedData.forEach(row => {
                    if (!grouped[row.region]) {
                        grouped[row.region] = { region: row.region, lat: row.lat, lon: row.lon, count: 0 };
                    }
                    grouped[row.region].count += 1;
                });
                return Object.values(grouped).sort((a, b) => b.count - a.count);
            }, [processedData]);

            // Initialize map
            useEffect(() => {
                if (regionData.length === 0) return;
                
                setTimeout(() => {
                    const mapContainer = document.getElementById('map-container');
                    if (!mapContainer) return;
                    
                    if (mapContainer._leaflet_id) {
                        mapContainer._leaflet_id = null;
                        mapContainer.innerHTML = '';
                    }
                    
                    try {
                        const map = L.map('map-container').setView([54.5, -3.5], 6);
                        
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '© OpenStreetMap contributors',
                            maxZoom: 19
                        }).addTo(map);
                        
                        regionData.forEach(region => {
                            if (region.lat && region.lon) {
                                const size = Math.max(5, Math.min(25, region.count / 100));
                                L.circleMarker([region.lat, region.lon], {
                                    radius: size,
                                    fillColor: '#4a90e2',
                                    color: '#2e5c8a',
                                    weight: 1,
                                    opacity: 0.8,
                                    fillOpacity: 0.6
                                }).bindPopup(`<strong>${region.region}</strong><br>Sponsors: ${region.count}`).addTo(map);
                            }
                        });
                    } catch (err) {
                        console.error('Map error:', err);
                    }
                }, 100);
            }, [regionData]);

            if (loading) {
                return (
                    <div className="dashboard-container">
                        <div className="loading">
                            <div className="spinner"></div>
                            <p style={{ marginTop: '20px' }}>Loading dashboard...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="dashboard-container">
                    {/* Header */}
                    <div className="header">
                        <h1>UK Visa Sponsor Register</h1>
                        <div className="header-search">
                            <input
                                type="text"
                                placeholder="Enter Organisation Name"
                                value={filters.searchOrg}
                                onChange={(e) => setFilters({...filters, searchOrg: e.target.value})}
                            />
                        </div>
                    </div>

                    {/* SIDEBAR */}
                    <div className="sidebar">
                        <div className="card kpi-card">
                            <h3>Total Organisations Found</h3>
                            <div className="kpi-value">{processedData.length.toLocaleString()}</div>
                        </div>

                        <div className="card filter-section">
                            <h3>Registration Date</h3>
                            <div className="date-inputs">
                                <input type="number" min="2013" max="2026" value={filters.startYear} onChange={(e) => setFilters({...filters, startYear: parseInt(e.target.value)})} />
                                <input type="number" min="2013" max="2026" value={filters.endYear} onChange={(e) => setFilters({...filters, endYear: parseInt(e.target.value)})} />
                            </div>
                        </div>

                        <div className="card filter-section">
                            <h3>Region</h3>
                            <div className="checkbox-group">
                                {uniqueRegions.map(region => (
                                    <div key={region} className="checkbox-item">
                                        <input type="checkbox" id={`region-${region}`} checked={filters.regions.includes(region)} onChange={(e) => {
                                            if (e.target.checked) {
                                                setFilters({...filters, regions: [...filters.regions, region]});
                                            } else {
                                                setFilters({...filters, regions: filters.regions.filter(r => r !== region)});
                                            }
                                        }} />
                                        <label htmlFor={`region-${region}`}>{region}</label>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="card filter-section">
                            <h3>Industry</h3>
                            <input type="text" className="filter-input" placeholder="Search industry..." value={filters.searchIndustry} onChange={(e) => setFilters({...filters, searchIndustry: e.target.value})} />
                            <div className="checkbox-group">
                                {uniqueIndustries.filter(ind => ind.toLowerCase().includes(filters.searchIndustry.toLowerCase())).slice(0, 10).map(industry => (
                                    <div key={industry} className="checkbox-item">
                                        <input type="checkbox" id={`ind-${industry}`} checked={filters.industries.includes(industry)} onChange={(e) => {
                                            if (e.target.checked) {
                                                setFilters({...filters, industries: [...filters.industries, industry]});
                                            } else {
                                                setFilters({...filters, industries: filters.industries.filter(i => i !== industry)});
                                            }
                                        }} />
                                        <label htmlFor={`ind-${industry}`}>{industry}</label>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* CONTENT */}
                    <div className="content">
                        <div className="chart-card" style={{ gridColumn: '1 / -1' }}>
                            <h3>Industries by Region</h3>
                            <div id="map-container"></div>
                        </div>

                        <div className="chart-card">
                            <h3>Industries by Year of Registration</h3>
                            <div className="chart-wrapper">
                                <svg viewBox="0 0 450 300">
                                    {yearData.map((d, i) => {
                                        const maxCount = Math.max(...yearData.map(x => x.count), 1);
                                        const barHeight = (d.count / maxCount) * 220;
                                        const x = (i * (410 / yearData.length)) + 30;
                                        const y = 260 - barHeight;
                                        return (
                                            <g key={i} className="clickable-bar" onClick={() => {
                                                if (filters.years.includes(d.year)) {
                                                    setFilters({...filters, years: filters.years.filter(yr => yr !== d.year)});
                                                } else {
                                                    setFilters({...filters, years: [...filters.years, d.year]});
                                                }
                                            }}>
                                                <rect x={x} y={y} width={Math.max(1, (410 / yearData.length) - 2)} height={barHeight} fill="#4a90e2" />
                                                <text x={x + (410 / yearData.length) / 2} y={280} textAnchor="middle" fill="#666" fontSize="10">{d.year}</text>
                                                <text x={x + (410 / yearData.length) / 2} y={y - 5} textAnchor="middle" fill="#fff" fontSize="9" fontWeight="bold">{d.count}</text>
                                            </g>
                                        );
                                    })}
                                </svg>
                            </div>
                        </div>

                        <div className="chart-card">
                            <h3>Organisation Name (Showing {startIdx + 1}-{Math.min(startIdx + itemsPerPage, processedData.length)} of {processedData.length.toLocaleString()})</h3>
                            <div className="table-wrapper">
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Organisation Name</th>
                                            <th>Year</th>
                                            <th>Town</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {tableData.map((row, idx) => (
                                            <tr key={idx}>
                                                <td>{row['Organisation Name']}</td>
                                                <td>{row.year}</td>
                                                <td>{row.town}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="pagination">
                                <button onClick={() => setCurrentPage(1)} disabled={currentPage === 1}>First</button>
                                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1}>Previous</button>
                                <span>Page {currentPage} of {totalPages}</span>
                                <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages}>Next</button>
                                <button onClick={() => setCurrentPage(totalPages)} disabled={currentPage === totalPages}>Last</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>
</body>
</html>
